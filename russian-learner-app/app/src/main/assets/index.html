<!doctype html><html lang="ka"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>რუსული თამაშით</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:14px;background:#0e1222;color:#f4f6ff;font:16px/1.45 system-ui,sans-serif}.wrap{max-width:720px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.brand{display:flex;gap:10px;align-items:center}.logo{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,#9b8cff,#68dfd0);display:grid;place-items:center;color:#111;font-size:24px;font-weight:900}.brand b{font-size:20px}.coins{color:#ffd166;font-weight:800}.hero,.game{background:linear-gradient(145deg,#1b2038,#171c30);border:1px solid #343d60;border-radius:20px;padding:18px;box-shadow:0 12px 35px #0004}.hero{margin-bottom:12px}.hint{text-align:center;color:#aab3d0}.word{text-align:center;font-size:clamp(38px,10vw,60px);font-weight:900;margin:24px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.opt{min-height:76px;border:1px solid #343d60;border-radius:15px;background:#222a45;color:#fff;padding:12px;font-size:18px;font-weight:800}.opt:active{transform:scale(.98)}.correct{background:#174433!important;border-color:#4bd39a!important}.wrong{background:#4b2636!important;border-color:#ff7187!important}.feedback{text-align:center;min-height:30px;margin:12px;font-weight:800}.good{color:#4bd39a}.bad{color:#ff7187}.next{display:block;margin:10px auto 0;border:0;border-radius:13px;padding:13px 22px;background:#9b8cff;color:#fff;font-weight:900;font-size:16px}.stats{display:flex;justify-content:space-between;color:#aab3d0;font-size:13px;margin-top:14px}.start{width:100%;padding:14px;border:0;border-radius:14px;background:#68dfd0;color:#111;font-weight:900;font-size:17px;margin-top:14px}.small{color:#aab3d0;text-align:center;font-size:12px;margin-top:14px}@media(max-width:480px){.grid{gap:8px}.opt{font-size:15px;min-height:68px}}
</style></head><body><div class="wrap"><header class="top"><div class="brand"><div class="logo">Я</div><b>რუსული თამაშით</b></div><div class="coins">🪙 <span id="coins">0</span></div></header>
<section class="hero"><h2>🎯 4 ვარიანტი</h2><p>აირჩიე სწორი რუსული თარგმანი. დააჭირე პასუხს — არჩევა მაშინვე ფიქსირდება.</p></section>
<section class="game"><div class="hint">ქართული სიტყვა</div><div class="word" id="word">...</div><div class="grid" id="options"></div><div class="feedback" id="feedback"></div><button class="next" id="next" disabled>შემდეგი →</button><div class="stats"><span>სწორი: <b id="correct">0</b></span><span>რაუნდი: <b id="round">0</b></span></div></section><div class="small">ავტორიზაცია არ არის • ინტერნეტი არ არის საჭირო • პროგრესი ინახება ტელეფონში</div></div>
<script>
const W=[
["გამარჯობა","привет"],["ნახვამდის","до свидания"],["მადლობა","спасибо"],["გთხოვ","пожалуйста"],["კი","да"],["არა","нет"],["დილა","утро"],["დღე","день"],["საღამო","вечер"],["ღამე","ночь"],["წყალი","вода"],["პური","хлеб"],["რძე","молоко"],["ყავა","кофе"],["ჩაი","чай"],["სახლი","дом"],["სკოლა","школа"],["სამსახური","работа"],["ქუჩა","улица"],["ქალაქი","город"],["ქვეყანა","страна"],["ოჯახი","семья"],["მეგობარი","друг"],["ბავშვი","ребёнок"],["ქალი","женщина"],["კაცი","мужчина"],["ადამიანი","человек"],["წიგნი","книга"],["რვეული","тетрадь"],["კალამი","ручка"],["მაგიდა","стол"],["სკამი","стул"],["ფანჯარა","окно"],["კარი","дверь"],["მანქანა","машина"],["ავტობუსი","автобус"],["მატარებელი","поезд"],["გზა","дорога"],["მაღაზია","магазин"],["ფული","деньги"],["დრო","время"],["დღეს","сегодня"],["ხვალ","завтра"],["გუშინ","вчера"],["ახლა","сейчас"],["აქ","здесь"],["იქ","там"],["დიდი","большой"],["პატარა","маленький"],["კარგი","хороший"],["ცუდი","плохой"],["ლამაზი","красивый"],["ახალი","новый"],["ძველი","старый"],["ცხელი","горячий"],["ცივი","холодный"],["სწრაფი","быстрый"],["ნელი","медленный"],["მიყვარს","люблю"],["მინდა","хочу"],["ვიცი","знаю"],["მესმის","понимаю"],["ვხედავ","вижу"],["ვსწავლობ","учусь"],["ვმუშაობ","работаю"],["ვკითხულობ","читаю"],["ვწერ","пишу"],["მივდივარ","иду"],["მოვდივარ","прихожу"],["ვჭამ","ем"],["ვსვამ","пью"],["მძინავს","сплю"],["ვფიქრობ","думаю"],["სად","где"],["როდის","когда"],["რატომ","почему"],["როგორ","как"],["ვინ","кто"],["რა","что"],["რამდენი","сколько"],["ერთი","один"],["ორი","два"],["სამი","три"],["ოთხი","четыре"],["ხუთი","пять"],["ექვსი","шесть"],["შვიდი","семь"],["რვა","восемь"],["ცხრა","девять"],["ათი","десять"],["წითელი","красный"],["ლურჯი","синий"],["მწვანე","зелёный"],["თეთრი","белый"],["შავი","чёрный"],["მზე","солнце"],["წვიმა","дождь"],["თოვლი","снег"],["ცა","небо"],["ზღვა","море"],["მთა","гора"],["ხე","дерево"],["ყვავილი","цветок"],["ძაღლი","собака"],["კატა","кошка"],["ჩიტი","птица"],["თევზი","рыба"],["საჭმელი","еда"],["ხორცი","мясо"],["ვაშლი","яблоко"],["ექიმი","врач"],["მასწავლებელი","учитель"],["მძღოლი","водитель"],["მოსწავლე","ученик"],["ბოდიში","извините"],["დახმარება","помощь"],["სიყვარული","любовь"],["სიხარული","радость"],["მუსიკა","музыка"]
];
let i=-1,correct=+localStorage.rlCorrect||0,round=+localStorage.rlRound||0,coins=+localStorage.rlCoins||0,answered=false,current;
const $=x=>document.getElementById(x); function save(){localStorage.rlCorrect=correct;localStorage.rlRound=round;localStorage.rlCoins=coins}
function shuffle(a){return a.sort(()=>Math.random()-.5)}
function newQ(){answered=false;current=W[Math.floor(Math.random()*W.length)];$("word").textContent=current[0];$("feedback").textContent="";$("feedback").className="feedback";$("next").disabled=true;let opts=shuffle([current,...shuffle(W.filter(x=>x!==current)).slice(0,3)]);$("options").innerHTML="";opts.forEach(x=>{let b=document.createElement("button");b.className="opt";b.textContent=x[1];b.onclick=()=>answer(b,x);$("options").append(b)});round++;$("round").textContent=round;save()}
function answer(b,x){if(answered)return;answered=true;document.querySelectorAll(".opt").forEach(z=>z.disabled=true);if(x===current){b.classList.add("correct");correct++;coins+=5;$("feedback").textContent="სწორია! +5 🪙";$("feedback").className="feedback good"}else{b.classList.add("wrong");document.querySelectorAll(".opt").forEach(z=>{if(z.textContent===current[1])z.classList.add("correct")});$("feedback").textContent="არასწორია — სწორი პასუხია: "+current[1];$("feedback").className="feedback bad"}$("correct").textContent=correct;$("coins").textContent=coins;$("next").disabled=false;save()}
$("next").onclick=newQ;$("correct").textContent=correct;$("round").textContent=round;$("coins").textContent=coins;newQ();
</script></body></html>
